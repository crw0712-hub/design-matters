<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Design Matters · Community Benefits</title>
<style>
:root{--paper:#fbfaf6;--ink:#0a0a0a;--acid:#b8ff17;--line:#d9d7cf;--muted:#77736e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#efeee9;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.preview-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px clamp(20px,4vw,48px);border-bottom:1px solid var(--ink);background:var(--paper)}
.preview-brand{font-size:15px;font-weight:900;letter-spacing:-.035em;display:flex;align-items:center;gap:12px}
.preview-brand b{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;border:1.4px solid var(--ink);background:var(--acid);font-weight:950}
.preview-return{font-size:12px;font-weight:800;border:1px solid var(--ink);border-radius:99px;padding:10px 15px}
.preview-return:hover{background:var(--acid)}
.preview-page{min-height:calc(100vh - 68px);padding:38px 18px 55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px}
.preview-label{width:min(720px,100%);display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:10px;letter-spacing:.09em;font-weight:850;color:#68645e}
.preview-label span:last-child{text-align:right}
.topic-dialog{width:min(720px,100%);border:1.5px solid var(--ink);border-radius:26px;background:var(--paper);box-shadow:0 28px 90px rgba(0,0,0,.12);overflow:hidden}
.topic-step{padding:34px;min-height:520px;display:flex;flex-direction:column}
.topic-step-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.topic-step-count{font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.topic-modal-close{width:36px;height:36px;border:1px solid var(--ink);border-radius:50%;background:transparent;font-size:22px;line-height:34px;cursor:pointer;text-align:center}
.topic-complete-mark{width:62px;height:62px;margin-top:56px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;background:var(--acid);font-size:30px;font-weight:950}
.topic-step h3{margin:19px 0 12px;max-width:560px;font-size:clamp(34px,4vw,54px);line-height:1;letter-spacing:-.055em}
.topic-step p{max-width:560px;margin:0;color:#4a4742;font-size:15px;line-height:1.6}
.topic-benefits{margin:34px 0 0;border-top:1px solid var(--ink)}
.topic-benefit{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.topic-benefit strong{display:block;font-size:13px;line-height:1.35}
.topic-benefit span{color:#55514b;font-size:13px;line-height:1.45}
.topic-benefit-no{font-size:11px;font-weight:900}
.topic-form-area{margin-top:auto;padding-top:36px;display:flex;flex-direction:column;align-items:center}
.topic-primary{display:block;width:100%;margin-top:0;padding:16px 20px;border:1.5px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:900;text-align:center;cursor:pointer}
.topic-primary:hover{background:var(--acid);color:var(--ink)}
.topic-secondary{margin-top:12px;border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px}
.preview-foot{font-size:11px;color:#77736e;text-align:center;line-height:1.6}
@media(max-width:760px){.preview-bar{padding:12px 16px}.preview-brand{font-size:12px}.preview-return{font-size:11px;padding:8px 10px}.preview-page{padding:18px 10px 30px;justify-content:flex-start}.topic-dialog{border-radius:20px}.topic-step{min-height:calc(100dvh - 180px);padding:26px 22px}.topic-complete-mark{margin-top:46px}.topic-benefit{grid-template-columns:30px 1fr;gap:10px}.preview-label{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<header class="preview-bar">
  <a class="preview-brand" href="./"><b>D</b>DESIGN MATTERS</a>
  <a class="preview-return" href="./">← Back to Design Matters</a>
</header>
<main class="preview-page">
  
  <div class="topic-dialog" role="region" aria-label="Design Matters community benefits">
    <section class="topic-step">
      <div class="topic-step-top"><span class="topic-step-count">02 / DESIGN MATTERS</span><a class="topic-modal-close" href="./" aria-label="Back to homepage">×</a></div>
      <div class="topic-complete-mark" aria-hidden="true">✓</div>
      <h3>兴趣已保存。</h3>
      <p>再花一分钟创建 Design Matters profile，让之后的参与更顺畅。</p>
      <div class="topic-benefits">
        <div class="topic-benefit"><span class="topic-benefit-no">01</span><div><strong>每一期圆桌总结</strong><span>持续收到每场讨论里真正值得留下的判断、分歧和变化。</span></div></div>
        <div class="topic-benefit"><span class="topic-benefit-no">02</span><div><strong>与你相关的活动提醒</strong><span>当新的圆桌与你关注的主题匹配时，优先收到报名提醒。</span></div></div>
        <div class="topic-benefit"><span class="topic-benefit-no">03</span><div><strong>来自全球的设计师圈层</strong><span>进入一个围绕 AI × Design 真实实践持续连接的全球同行网络。</span></div></div>
      </div>
      <div class="topic-form-area">
        <a class="topic-primary" href="./profile.html?setup=1" id="startCommunityProfile">创建我的 profile →</a>
        <a class="topic-secondary" href="./">暂时不用</a>
      </div>
    </section>
  </div>
  
</main>
<script src="./member-flow.js?v=benefits-flow-20261011"></script>
<script>
(function(){
  var start=document.getElementById('startCommunityProfile');
  if(start){
    start.addEventListener('click',function(){
      if(window.DMFlow && window.DMFlow.beginBenefitsProfile){
        window.DMFlow.beginBenefitsProfile();
      }
    });
  }
})();
</script>
</body>
</html>
