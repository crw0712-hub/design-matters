<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Matters — AI × Design</title>
<style>
:root{--bg:#f5f3ec;--paper:#fbfaf6;--ink:#0a0a0a;--muted:#6e6c66;--line:#d8d5cd;--acid:#b8ff17}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{width:min(860px,calc(100% - 24px));margin:24px auto;border:1.5px solid var(--ink);border-radius:28px;overflow:hidden;background:var(--paper)}
.head{padding:30px;background:var(--acid);border-bottom:1px solid var(--ink)}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em}
h1{font-size:clamp(38px,7vw,72px);line-height:.95;letter-spacing:-.055em;margin:14px 0 14px}
.head p{margin:0;max-width:650px;font-size:16px;line-height:1.55}
.form{padding:28px}
.event{display:grid;grid-template-columns:26px 58px 1fr;gap:10px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.event strong{font-size:12px}.event span{font-size:15px;line-height:1.4}
.label{display:block;margin:24px 0 8px;font-size:12px;font-weight:850}
input[type=email]{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}
.consent{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:12px;color:#555;line-height:1.5}
button{width:100%;padding:15px;border:1.5px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-weight:900;cursor:pointer}
button:disabled{opacity:.55}
.status{min-height:22px;margin-top:12px;font-size:12px}
.error{color:#8d1919;font-weight:800}
.success{display:none;padding:58px 28px;text-align:center}
.done .head,.done .form{display:none}.done .success{display:block}
.mark{width:64px;height:64px;margin:0 auto 18px;border:1.5px solid var(--ink);border-radius:50%;background:var(--acid);display:grid;place-items:center;font-size:30px;font-weight:950}
.success h2{font-size:34px;letter-spacing:-.045em;margin:0 0 10px}.success p{margin:0 auto;max-width:540px;color:#444;line-height:1.65}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <div class="eyebrow">DESIGN MATTERS · UPCOMING</div>
    <h1>接下来的讨论。</h1>
    <p>看到想参与的问题，可以先留下兴趣。对应场次开放报名时，我们会通知你。</p>
  </div>

  <form class="form" id="interestForm" novalidate>
    <label class="event"><input class="eventCheck" type="checkbox" value="009"><strong>#009</strong><span>When AI can act for you, what should you still control?</span></label>
    <label class="event"><input class="eventCheck" type="checkbox" value="010"><strong>#010</strong><span>If everyone can build, what is design actually responsible for?</span></label>
    <label class="event"><input class="eventCheck" type="checkbox" value="011"><strong>#011</strong><span>Why do AI pilots still fail to become real workflows?</span></label>
    <label class="event"><input class="eventCheck" type="checkbox" value="012"><strong>#012</strong><span>When AI does the execution, what does senior judgment actually mean?</span></label>
    <label class="event"><input class="eventCheck" type="checkbox" value="013"><strong>#013</strong><span>What does an AI-native team actually look like?</span></label>

    <label class="label" for="email">邮箱</label>
    <input id="email" type="email" placeholder="name@example.com">

    <label class="consent"><input id="consent" type="checkbox"><span>我同意接收所选 Design Matters 场次的报名通知。</span></label>

    <button id="submitBtn" type="submit">报名开放时通知我 →</button>
    <div class="status" id="status" aria-live="polite"></div>
  </form>

  <div class="success">
    <div class="mark">✓</div>
    <h2>提交成功</h2>
    <p>我们已经记录你的兴趣。你选择的场次开放报名时，我们会通过邮件通知你。</p>
  </div>
</div>

<script>
const ENDPOINT='https://khhfxkrwgcckgqupncyw.supabase.co/rest/v1/rpc/register_dm_interest_public';
const APIKEY='sb_publishable_oXnMd_aF95wYTPcq6TwGVg_alaNdfTH';

const form=document.getElementById('interestForm');
const statusEl=document.getElementById('status');
const btn=document.getElementById('submitBtn');
const wrap=document.getElementById('wrap');

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  statusEl.className='status';
  statusEl.textContent='正在检查…';

  const eventIds=[...document.querySelectorAll('.eventCheck:checked')].map(x=>x.value);
  const email=document.getElementById('email').value.trim().toLowerCase();
  const consent=document.getElementById('consent').checked;

  if(!eventIds.length){
    statusEl.className='status error';
    statusEl.textContent='请至少选择一个感兴趣的场次。';
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    statusEl.className='status error';
    statusEl.textContent='请输入有效的邮箱地址。';
    return;
  }
  if(!consent){
    statusEl.className='status error';
    statusEl.textContent='请勾选同意接收报名通知。';
    return;
  }

  btn.disabled=true;
  btn.textContent='提交中…';
  statusEl.textContent='正在提交…';

  try{
    const res=await fetch(ENDPOINT,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':APIKEY
      },
      body:JSON.stringify({
        p_email:email,
        p_event_ids:eventIds,
        p_consent:true,
        p_locale:'zh'
      })
    });

    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.message||data.error||('HTTP '+res.status));

    wrap.classList.add('done');
  }catch(err){
    console.error(err);
    statusEl.className='status error';
    statusEl.textContent='提交没有成功：'+(err.message||'请稍后再试');
  }finally{
    btn.disabled=false;
    btn.textContent='报名开放时通知我 →';
  }
});
</script>
</body>
</html>
