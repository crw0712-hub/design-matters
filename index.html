<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Matters</title>
<style>
html,body{margin:0;min-height:100%;background:#f5f3ec;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;color:#0a0a0a;font-weight:800;letter-spacing:.02em}
</style>
</head>
<body>
<div id="loading">DESIGN MATTERS</div>
<script>
(async()=>{
  try{
    const files = Array.from({length:7},(_,i)=>`./chunks/${i}.txt`);
    const parts = await Promise.all(files.map(async url=>{
      const r = await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
      return r.text();
    }));
    document.open();
    document.write(parts.join(''));
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById('loading').textContent='Site failed to load. Please refresh.';
  }
})();
</script>
</body>
</html>
