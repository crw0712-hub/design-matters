<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile · Design Matters</title><link rel="stylesheet" href="./community.css"><link rel="stylesheet" href="./member.css"><link rel="stylesheet" href="./member-refinement.css?v=about-baseline-20261011"></head><body><div class="shell"><header class="bar"><a class="brand" href="./"><b>D</b> DESIGN MATTERS</a><a class="back" href="./">← Back to Design Matters</a></header><main class="profile dm-personal-page" id="profileContent" hidden>
<section class="profile-identity dm-personal-header">
  <div class="avatar-cluster">
    <div class="avatar profile-avatar"><span id="avatarText"></span><img id="avatarImage" alt="My avatar" hidden></div>
    <input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <div id="avatarBadge" class="avatar-orbit-badge" aria-label="Community badge" hidden></div>
  </div>
  <div class="identity-copy"><h1 id="headerName"></h1><p id="memberEmail" class="identity-email"></p><div id="badgeHeader" class="identity-badge-name"></div><div class="badge-community-row" id="badgeCommunityRow" hidden><strong id="badgePeerCount">28</strong><span>位成员与你选择相同的 Badge</span><span class="badge-demo-tag">示例</span></div></div>
  <button class="edit-action" type="button" id="editProfile">Edit Profile ↗</button>
</section>
<section class="simple-section">
  <div class="simple-heading"><h2>INTERESTED TOPICS</h2></div>
  <div id="topicTags" class="choice-set dm-interest-tags"></div>
  <p id="emptyTopics" class="muted">选择感兴趣的方向，让未来的圆桌与你更相关。</p>
  <div class="event-notice"><span class="event-notice-symbol">↗</span><p><strong>We'll keep you in the loop.</strong> 当与你关注的方向相关的圆桌开放报名时，我们会通过邮件通知你，并附上 Luma 报名链接。</p></div>
</section>
<section class="simple-section">
  <div class="simple-heading"><h2>PAST EVENTS</h2></div><div id="events"></div>
</section>
<section class="simple-section about-section">
  <div class="simple-heading"><h2>ABOUT</h2></div><p id="bioText" class="bio-display"></p>
</section>
</main><div class="profile-load" id="profileLoading"><strong>Open your Design Matters Profile</strong><p>如果资料没有显示，请使用之前的邮箱继续。</p><p><a href="./account.html" class="btn">Continue with email →</a></p></div>
<div class="member-overlay" id="editor" hidden><section class="member-sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle"><div class="sheet-top"><h2 id="editorTitle">Edit your profile</h2><button class="sheet-close" id="closeEditor" type="button" aria-label="Close">×</button></div><div class="sheet-body"><button id="editAvatarButton" class="edit-photo-link" type="button"><span class="edit-photo-symbol">↗</span> Change Photo</button><div class="field"><label for="displayName">DISPLAY NAME</label><input id="displayName" maxlength="80"></div><div class="field"><label for="bio">ABOUT YOU</label><textarea id="bio" maxlength="400" placeholder="A little about what you do and explore…"></textarea></div><div class="field"><label>INTERESTED TOPICS</label><div class="choice-set" id="topicChoices"></div></div><div class="field"><label>COMMUNITY BADGE · OPTIONAL</label><div class="badge-choices" id="badgeChoices"></div></div><div id="status" class="status" role="status"></div><button class="btn" id="save" type="button">Save changes →</button></div></section></div></div>
<script src="./member-flow.js?v=benefits-flow-20261011"></script><script>
try{if(!window.DMFlow)throw new Error('Profile script unavailable');window.DMFlow.setupProfile();}
catch(error){console.error(error);const el=document.getElementById('profileLoading');if(el){el.hidden=false;el.innerHTML='<strong>Unable to open your profile.</strong><p>Please return to the email step.</p><a href="./account.html" class="btn">Continue with email →</a>';}}
</script></body></html>
