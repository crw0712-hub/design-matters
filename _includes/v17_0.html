<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Design Matters — AI × Design Roundtable</title>
<meta content="Design Matters：持续追踪 AI 如何改变真实设计实践的圆桌与同行判断网络。" name="description"/>
<style>
  :root{
    --bg:#f5f3ec;
    --paper:#fbfaf6;
    --ink:#0a0a0a;
    --muted:#6e6c66;
    --line:#d8d5cd;
    --acid:#b8ff17;
    --acid2:#a7f800;
    --white:#fff;
    --radius:24px;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    color:var(--ink);
    background:var(--bg);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button,input,textarea{font:inherit}

  .page{
    width:min(1480px, calc(100% - 32px));
    margin:16px auto 40px;
    border:1.5px solid var(--ink);
    background:var(--paper);
    border-radius:30px;
    overflow:hidden;
  }

  .nav{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--line);
    background:rgba(251,250,246,.92);
    backdrop-filter:blur(16px);
  }
  .brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:-.03em}
  .mark{
    width:34px;height:34px;border-radius:10px;background:var(--acid);
    display:grid;place-items:center;border:1.4px solid var(--ink);font-weight:950
  }
  .navlinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .navlinks a{
    padding:9px 13px;border:1px solid transparent;border-radius:999px;
    font-size:13px;font-weight:700;
  }
  .navlinks a:hover{border-color:var(--ink);background:var(--white)}
  .apply-pill{background:var(--ink)!important;color:var(--white)!important}

  .hero{
    min-height:720px;
    display:grid;grid-template-columns:1.18fr .82fr;
    border-bottom:1px solid var(--ink);
  }
  .hero-copy{
    padding:72px 56px 60px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .kicker{
    display:inline-flex;align-items:center;gap:9px;
    width:max-content;padding:8px 13px;border-radius:999px;
    background:var(--acid);font-size:13px;font-weight:850;
    border:1px solid var(--ink);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}
  h1{
    margin:36px 0 24px;
    max-width:880px;
    font-size:clamp(58px,7vw,118px);
    line-height:.92;letter-spacing:-.07em;font-weight:900;
  }
  .hero-copy p{
    max-width:770px;margin:0;
    font-size:clamp(19px,2vw,28px);line-height:1.48;letter-spacing:-.025em;
  }
  .hero-meta{
    margin-top:56px;display:flex;gap:10px;flex-wrap:wrap
  }
  .chip{
    padding:9px 13px;border:1px solid var(--ink);border-radius:999px;
    font-size:12px;font-weight:750;background:transparent;
  }

  .hero-visual{
    border-left:1px solid var(--ink);
    padding:38px;
    background:var(--acid);
    display:flex;align-items:center;justify-content:center;
    min-height:720px;
  }
  .network{
    width:min(540px,100%);aspect-ratio:1/1;
    position:relative;border:1.5px solid var(--ink);border-radius:32px;
    background:var(--paper);overflow:hidden;
  }
  .network svg{width:100%;height:100%;display:block}
  .network-note{
    position:absolute;left:22px;bottom:20px;right:22px;
    display:flex;justify-content:space-between;gap:16px;
    padding-top:16px;border-top:1px solid var(--ink);
    font-size:12px;font-weight:780;text-transform:uppercase;letter-spacing:.05em
  }

  .statement{
    padding:34px 56px;
    display:grid;grid-template-columns:180px 1fr;
    gap:44px;border-bottom:1px solid var(--ink);
    background:var(--ink);color:white;
  }
  .statement .label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#c9c9c9}
  .statement .big{
    font-size:clamp(25px,3vw,46px);line-height:1.2;letter-spacing:-.04em;font-weight:760
  }
  .statement em{font-style:normal;color:var(--acid)}

  section{border-bottom:1px solid var(--ink)}
  .section-head{
    display:grid;grid-template-columns:180px 1fr;
    gap:44px;padding:70px 56px 42px;
  }
  .eyebrow{
    font-size:12px;line-height:1.3;text-transform:uppercase;letter-spacing:.1em;font-weight:850
  }
  .section-head h2{
    margin:0;font-size:clamp(42px,5vw,78px);line-height:.98;letter-spacing:-.055em
  }
  .section-head p{
    max-width:820px;margin:24px 0 0;
    font-size:19px;line-height:1.55;color:#333
  }

  .findings{
    display:grid;grid-template-columns:repeat(5,1fr);
    border-top:1px solid var(--ink);
  }
  .finding{
    min-height:360px;padding:26px;
    border-right:1px solid var(--ink);
    display:flex;flex-direction:column;justify-content:space-between;
    transition:.22s ease;
  }
  .finding:last-child{border-right:none}
  .finding:hover{background:var(--acid)}
  .finding-no{font-size:12px;font-weight:850}
  .finding h3{
    font-size:26px;line-height:1.12;letter-spacing:-.04em;margin:36px 0 12px
  }
  .finding p{font-size:14px;line-height:1.55;color:#45433f;margin:0}
  .finding .take{
    margin-top:22px;padding-top:18px;border-top:1px solid currentColor;
    font-size:12px;font-weight:800;line-height:1.45
  }

  .archive-wrap{padding:0 56px 72px}
  .archive-intro{
    display:flex;justify-content:space-between;gap:28px;align-items:end;
    padding:0 0 22px;
  }
  .archive-intro p{max-width:680px;color:var(--muted);line-height:1.55;margin:0}
  .archive-grid{
    display:grid;grid-template-columns:repeat(2,1fr);
    border-top:1px solid var(--ink);border-left:1px solid var(--ink);
  }
  details.session{
    border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);
    background:var(--paper);transition:.2s;
  }
  details.session[open]{background:#fff}
  details.session summary{
    list-style:none;cursor:pointer;padding:24px 24px 22px;
    min-height:214px;display:flex;flex-direction:column;justify-content:space-between;
  }
  details.session summary::-webkit-details-marker{display:none}
  .session-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
  .session-no{
    font-size:12px;font-weight:900;background:var(--acid);border:1px solid var(--ink);
    padding:7px 9px;border-radius:999px
  }
  .plus{font-size:28px;line-height:1;font-weight:400;transition:.2s}
  details[open] .plus{transform:rotate(45deg)}
  .session h3{
    max-width:560px;margin:26px 0 16px;font-size:30px;line-height:1.08;letter-spacing:-.045em
  }
  .session-tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
  .session-body{
    padding:0 24px 28px;border-top:1px solid var(--line);
  }
  .session-body p{font-size:15px;line-height:1.65;color:#36342f;margin:22px 0 0}
  .session-body .signal{
    margin-top:18px;padding:16px;border:1px solid var(--ink);border-radius:14px;background:var(--acid);
    font-weight:800;line-height:1.45
  }

  .next{
    display:grid;grid-template-columns:.76fr 1.24fr;background:var(--acid);
  }
  .next-left{padding:58px 56px;border-right:1px solid var(--ink)}
  .next-left .season{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:900}
  .next-left h2{
    margin:26px 0 30px;font-size:clamp(58px,6.8vw,108px);
    line-height:.92;letter-spacing:-.07em
  }
  .next-left p{font-size:18px;line-height:1.55;max-width:560px}
  .next-right{padding:58px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:42px}
  .question-list{border-top:1px solid var(--ink)}
  .question{
    display:grid;grid-template-columns:44px 1fr;
    gap:16px;padding:18px 0;border-bottom:1px solid var(--ink);
    font-size:18px;line-height:1.4
  }
  .question span:first-child{font-weight:900}
  .context-card{
    border:1.5px solid var(--ink);border-radius:20px;padding:22px;background:var(--paper)
  }
  .context-card .small{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:900}
  .contexts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 12px}
  .contexts span{border:1px solid var(--ink);border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800}
  .context-card p{margin:14px 0 0;line-height:1.55;color:#34322e}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .btn{
    border:1.5px solid var(--ink);border-radius:999px;padding:12px 16px;
    font-size:13px;font-weight:850;background:var(--paper);cursor:pointer
  }
  .btn.primary{background:var(--ink);color:#fff}

  .join{
    padding:72px 56px;
    display:grid;grid-template-columns:.86fr 1.14fr;gap:76px;
  }
  .join h2{font-size:clamp(42px,5vw,74px);line-height:1;letter-spacing:-.055em;margin:0}
  .join p{font-size:18px;line-height:1.6;color:#45433f}
  .form{
    border:1px solid var(--ink);border-radius:22px;padding:22px;background:#fff;
  }
  .form label{display:block;font-size:12px;font-weight:850;margin:0 0 8px}
  .form textarea,.form input{
    width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);
    padding:14px 15px;margin-bottom:14px;outline:none;
  }
  .form textarea{min-height:120px;resize:vertical}
  .form textarea:focus,.form input:focus{bor
