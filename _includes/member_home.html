<style>
#topics,.conversation-board#upcoming,#interestModal,.join#join,#dmLayer{display:none!important}
.dm-topic-card:hover{transform:none!important}
.dm-topic-card .dm-visual{transform:none!important}
.dm-topic-card:hover .dm-visual{transform:none!important}
.dm-topic-card .dm-card-copy h3{font-size:clamp(22px,1.95vw,29px)}
.dm-topic-card .dm-visual svg{overflow:visible}
.dm-topic-card .dm-visual svg>*{transition:transform .5s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .5s,opacity .4s;transform-box:fill-box;transform-origin:center}
.dm-topic-card:nth-child(1):hover [data-move=delegate]{transform:translateX(24px)}
.dm-topic-card:nth-child(2):hover [data-move=connect]{transform:translateY(-12px)}
.dm-topic-card:nth-child(3):hover [data-move=build]{transform:translateY(-12px)}
.dm-topic-card:nth-child(4):hover [data-move=balance]{transform:rotate(10deg)}
.dm-topic-card:nth-child(5):hover [data-move=iterate]{transform:rotate(35deg)}
.dm-topic-card.chosen{background:var(--acid)}
.dm-topic-card[aria-pressed=true] .dm-card-plus{background:var(--ink);color:#fff}
.dm-user-controls{display:flex;gap:8px;align-items:center;margin-left:7px}
.dm-login-link{padding:9px 12px;border:1px solid var(--ink);border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.dm-login-link.primary{background:var(--acid)}
.dm-avatar-trigger{width:37px;height:37px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:50%;background:var(--acid);font-weight:900;cursor:pointer;overflow:hidden}
.dm-avatar-trigger img{width:100%;height:100%;object-fit:cover}
.dm-user-menu{position:absolute;right:20px;top:65px;min-width:180px;background:var(--paper);border:1px solid var(--ink);border-radius:12px;padding:6px;box-shadow:0 12px 32px #0002;z-index:55}
.dm-user-menu[hidden]{display:none!important}
.dm-user-menu a,.dm-user-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;font:inherit;font-size:13px;padding:11px 12px;border-radius:7px;cursor:pointer}
.dm-user-menu a:hover,.dm-user-menu button:hover{background:var(--acid)}
@media(max-width:760px){.dm-user-controls{margin-left:2px}.dm-login-link{padding:9px 10px;font-size:11px}.dm-user-menu{right:10px;top:56px}}
@media(prefers-reduced-motion:reduce){.dm-topic-card .dm-visual svg>*{transition:none!important;transform:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.min.js"></script>
<script>
(async function(){
const root=document.getElementById('dm-community'),original=document.getElementById('upcoming');if(root&&original)original.before(root);
const items=[
['agentic-products-agent-ux','Agentic Products & Agent UX','When agents act for us, how do we design control, trust and recovery?'],
['enterprise-ai','Enterprise AI','Why do pilots struggle to become real workflows?'],
['vibe-coding-design-roles','Vibe Coding & Prototyping','What changes when designers build directly?'],
['design-judgment-future-work','Design Roles, Judgment & Future of Work','Where does human judgment matter as execution becomes easier?'],
['ai-native-startups-product-strategy','AI-native Startups & AI Product Strategy','How do teams rethink product, roles and decisions?']
];
const cards=[...document.querySelectorAll('#dmTopicGrid .dm-topic-card')];let selected=new Set();
cards.forEach(card=>{
const rec=items.find(x=>x[0]===card.dataset.id);if(!rec)return;
const copy=card.querySelector('.dm-card-copy');copy.textContent='';
const h=document.createElement('h3');h.textContent=rec[1];const p=document.createElement('p');p.textContent=rec[2];copy.append(h,p);
card.addEventListener('click',()=>{
const id=card.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);
const on=selected.has(id);card.classList.toggle('chosen',on);card.setAttribute('aria-pressed',String(on));card.querySelector('.dm-card-plus').textContent=on?'✓':'+';
document.getElementById('dmNext').disabled=!selected.size;
document.getElementById('dmCount').textContent=selected.size?selected.size+' topics selected':'Choose the topics that interest you';
});
});
document.getElementById('dmNext').addEventListener('click',()=>{
if(!selected.size)return;sessionStorage.setItem('dm_pending_topics',JSON.stringify([...selected]));location.href='./account.html';
});
document.getElementById('dmAccount').addEventListener('click',()=>location.href='./account.html');
const oldJoin=document.querySelector('.navlinks a[href="#join"]');if(oldJoin)oldJoin.remove();
document.querySelectorAll('#next a[href="#join"]').forEach(el=>{el.href='#dm-community';el.textContent='Explore topics →';el.dataset.zh='探索讨论方向 →';el.dataset.en='Explore topics →'});
const nav=document.querySelector('.navlinks');if(!nav)return;
const controls=document.createElement('div');controls.className='dm-user-controls';nav.append(controls);
const menu=document.createElement('div');menu.className='dm-user-menu';menu.hidden=true;nav.append(menu);
const auth=window.supabase.createClient('https://khhfxkrwgcckgqupncyw.supabase.co','sb_publishable_oXnMd_aF95wYTPcq6TwGVg_alaNdfTH');
async function draw(){
const {data:{user}}=await auth.auth.getUser();controls.textContent='';menu.textContent='';menu.hidden=true;
if(!user){
 const login=document.createElement('a');login.className='dm-login-link';login.textContent='Log In';login.href='./account.html';
 const signup=document.createElement('a');signup.className='dm-login-link primary';signup.textContent='Sign Up';signup.href='./account.html';
 controls.append(login,signup);
}else{
 const {data:profile}=await auth.from('dm_member_profiles').select('display_name,avatar_url').eq('user_id',user.id).maybeSingle();
 const button=document.createElement('button');button.className='dm-avatar-trigger';button.type='button';button.setAttribute('aria-label','Account menu');button.textContent=(profile?.display_name||user.email||'D').charAt(0).toUpperCase();
 if(profile?.avatar_url){
 const {data}=await auth.storage.from('dm-avatars').createSignedUrl(profile.avatar_url,900);
 if(data?.signedUrl){button.textContent='';const image=document.createElement('img');image.src=data.signedUrl;image.alt='My profile';button.append(image);}
 }
 button.onclick=()=>menu.hidden=!menu.hidden;controls.append(button);
 const profileLink=document.createElement('a');profileLink.href='./profile.html';profileLink.textContent='My Profile';
 const logout=document.createElement('button');logout.type='button';logout.textContent='Log Out';logout.onclick=async()=>{await auth.auth.signOut();draw()};
 menu.append(profileLink,logout);
 }
}
await draw();
auth.auth.onAuthStateChange(()=>setTimeout(draw,0));
document.addEventListener('click',e=>{if(!controls.contains(e.target)&&!menu.contains(e.target))menu.hidden=true});
})();
</script>
