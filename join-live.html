<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join · Design Matters</title><style>
:root{--paper:#fbfaf6;--ink:#0a0a0a;--acid:#b8ff17}*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:var(--ink);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:20px max(22px,calc((100% - 1080px)/2));border-bottom:1px solid;background:var(--paper);font-weight:900}header a{color:inherit;text-decoration:none}.page{max-width:830px;margin:45px auto 80px;padding:36px;border:1.5px solid;border-radius:25px;background:var(--paper)}h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.07em;line-height:1.02;margin:12px 0 25px}h2{font-size:16px}small,.quiet{color:#67635c}label.field{display:block;font-size:12px;font-weight:850;margin:21px 0 7px}input[type=email],input[type=text]{width:100%;padding:15px;border:1px solid #99948a;border-radius:9px;background:white;font:inherit}input:focus{outline:2px solid var(--acid);outline-offset:2px}.topics,.expects{display:flex;flex-wrap:wrap;gap:8px}.pill{position:relative}.pill input{position:absolute;opacity:0}.pill span{display:inline-flex;padding:10px 14px;border:1px solid #b7b3ab;border-radius:99px;cursor:pointer;font-size:13px;font-weight:750}.pill input:checked+span{background:var(--acid);border-color:#111}.line{border-top:1px solid #d7d2c9;padding-top:19px;margin-top:25px}button.primary{width:100%;padding:17px;border:1px solid;border-radius:99px;background:#111;color:white;font:inherit;font-weight:900;cursor:pointer;margin-top:22px}button:disabled{opacity:.5;cursor:wait}.status{min-height:25px;color:#8b3028;font-size:13px;margin-top:8px}.good{color:#2f6822}.info{background:#edeae2;padding:18px;border-radius:13px;margin-top:22px}@media(max-width:700px){.page{margin:18px 10px;padding:22px}}</style></head><body>
<header><a href="./">▣ DESIGN MATTERS</a></header><main class="page"><small>DESIGN MATTERS / COMMUNITY</small><h1>继续你关心的讨论。</h1><p>注册后可收到圆桌总结、相关活动提醒，并与全球 AI × Design 同行保持联系。</p>
<form id="form"><div class="line"><h2>YOUR TOPICS / 关注的话题</h2><div class="topics" id="topics"></div></div><div class="line"><h2>WHAT YOU'D LIKE / 更想在这里得到什么</h2><div class="expects" id="expects"></div></div>
<label class="field" for="email">EMAIL / 邮箱</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"><div id="emailStatus" class="status" role="status"></div>
<label class="field" for="work">你现在主要在做什么？</label><input id="work" type="text" required maxlength="180" placeholder="例如：设计企业 Agent 体验">
<label class="field" for="goal">接下来想探索什么？</label><input id="goal" type="text" required maxlength="180" placeholder="例如：AI-native 产品">
<label class="field"><input id="consent" type="checkbox" required checked> 我同意接收 Design Matters 相关圆桌及总结邮件，可随时退订。</label>
<button class="primary" id="submit" type="submit">订阅相关圆桌与整理 →</button><div class="status" id="status" role="status" aria-live="polite"></div></form>
<div class="info" id="result" hidden><h2>请查看你的邮箱</h2><p>我们已请求发送安全验证邮件。请通过邮件中的链接验证邮箱并进入 Profile。已经有账号的用户也可以通过邮件链接登录。</p><p class="quiet">如果没有收到，请检查垃圾邮件文件夹。邮箱验证完成前不会宣称注册成功。</p></div>
</main><script type="module">
import{createClient}from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const client=createClient('https://khhfxkrwgcckgqupncyw.supabase.co','sb_publishable_oXnMd_aF95wYTPcq6TwGVg_alaNdfTH');
const TOPICS=[['agentic-products-agent-ux','Agent Experience & Human Control'],['enterprise-ai','Enterprise AI & Workflow Redesign'],['vibe-coding-design-roles','AI-assisted Building & Prototyping'],['design-judgment-future-work','Design Judgment & Agency'],['ai-native-startups-product-strategy','AI-native Products & Teams']];
const EXPECTS=[['insights','Sharper insights'],['cases','Real cases & methods'],['invites','Relevant roundtable invites'],['peers','Find peers'],['deepdives','Small-group deep dives'],['other','Something else']];
function draw(host,entries,name){document.getElementById(host).innerHTML=entries.map(([id,label])=>'<label class="pill"><input type="checkbox" name="'+name+'" value="'+id+'"><span>'+label+'</span></label>').join('')}
draw('topics',TOPICS,'topic');draw('expects',EXPECTS,'expect');
try{const pending=JSON.parse(localStorage.getItem('dm_pending_topics')||'[]');document.querySelectorAll('[name=topic]').forEach(i=>i.checked=pending.includes(i.value));}catch{}
const e=document.getElementById('email'),s=document.getElementById('emailStatus'),form=document.getElementById('form'),submit=document.getElementById('submit'),status=document.getElementById('status');
function validateEmail(){const v=e.value.trim().toLowerCase();if(!v){s.textContent='请填写邮箱';s.className='status';return false}if(!e.checkValidity()||!v.includes('.')){s.textContent='邮箱格式不正确';s.className='status';return false}s.textContent='格式正确；邮箱所有权将在邮件验证后确认。已有账号可通过同一验证链接登录。';s.className='status good';return true}
e.addEventListener('blur',validateEmail);
form.addEventListener('submit',async(ev)=>{ev.preventDefault();status.textContent='';if(!validateEmail()||!form.reportValidity())return;const topics=[...document.querySelectorAll('[name=topic]:checked')].map(x=>x.value);if(!topics.length){status.textContent='请至少选择一个话题';return}
const prefs={email:e.value.trim().toLowerCase(),topics,expectations:[...document.querySelectorAll('[name=expect]:checked')].map(x=>x.value),current_ai_work:document.getElementById('work').value.trim(),next_ai_goal:document.getElementById('goal').value.trim(),consent_roundtables:document.getElementById('consent').checked,consent_summaries:document.getElementById('consent').checked,locale:'zh'};
submit.disabled=true;status.textContent='正在请求验证邮件…';
try{
  sessionStorage.setItem('dm_verified_onboarding_v1',JSON.stringify(prefs));
  const redirect=location.origin+location.pathname.replace(/[^/]*$/,'profile-live.html');
  const{error}=await client.auth.signInWithOtp({email:prefs.email,options:{emailRedirectTo:redirect,shouldCreateUser:true}});
  if(error)throw error;
  form.hidden=true;document.getElementById('result').hidden=false;status.textContent='';
}catch(err){status.textContent=err.message||'请求失败，请稍后重试。';submit.disabled=false}
});
</script></body></html>
