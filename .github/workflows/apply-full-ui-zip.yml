name: Publish Design Matters full ZIP front-end
on:
  push:
    branches: [main]
    paths:
      - 'design-matters-full-v3-production-ready.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete homepage and Profile from ZIP
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('design-matters-full-v3-production-ready.zip') as z:
              for name in ('index.html', 'profile-live.html'):
                  data=z.read(name)
                  if b'DESIGN MATTERS' not in data.upper():
                      raise ValueError('Unexpected ZIP content for '+name)
                  open(name,'wb').write(data)
          PY
      - name: Publish through normal GitHub Pages branch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html profile-live.html
          if git diff --cached --quiet; then
            echo "Already on latest full ZIP design"
          else
            git commit -m "Publish Design Matters ZIP v3 complete front-end"
            git push origin HEAD:main
          fi