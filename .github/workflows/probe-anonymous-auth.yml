name: Probe Design Matters Anonymous Auth
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-anonymous-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signup-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe anonymous signup against the configured project
        env:
          DM_AUTH_URL: https://khhfxkrwgcckgqupncyw.supabase.co/auth/v1/signup
          DM_PUBLIC_KEY: sb_publishable_oXnMd_aF95wYTPcq6TwGVg_alaNdfTH
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          request=urllib.request.Request(
            os.environ['DM_AUTH_URL'],
            data=json.dumps({}).encode(),
            headers={'apikey':os.environ['DM_PUBLIC_KEY'],'Content-Type':'application/json'},
            method='POST'
          )
          try:
            with urllib.request.urlopen(request,timeout=15) as reply:
              data=json.load(reply)
              print('AUTH_PROBE: SUCCESS')
              print('TEST_ANONYMOUS_USER:',data.get('user',{}).get('id','missing'))
          except urllib.error.HTTPError as err:
            print('AUTH_PROBE: HTTP',err.code)
            print('ERROR:',err.read().decode('utf-8')[:300])
          PY