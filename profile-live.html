<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 Design Matters</title>
<style>
:root{--bg:#f5f3ec;--paper:#fbfaf6;--ink:#0a0a0a;--acid:#b8ff17;--line:#d8d5cd;--muted:#67635c}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input{font:inherit}
.page{width:min(1480px,calc(100% - 32px));margin:16px auto 42px;border:1.5px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--paper)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;border-bottom:1px solid var(--ink);background:rgba(251,250,246,.96)}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:900;letter-spacing:.02em}.mark{display:grid;place-items:center;width:34px;height:34px;border:1.3px solid var(--ink);background:var(--acid);border-radius:10px;font-weight:950}
.back-link{display:inline-flex;align-items:center;gap:10px;padding:13px 18px;border:1px solid var(--ink);border-radius:999px;font-size:13px;font-weight:850;background:transparent}
.back-link:hover{background:var(--acid)}
.main{padding:46px 56px 70px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;padding-bottom:34px;border-bottom:1px solid #d2cec5}
.hero-mark{position:relative;display:grid;place-items:center;width:84px;height:84px;background:var(--acid);border:2px solid var(--ink);border-radius:26px;font-weight:950;font-size:24px;letter-spacing:-.05em}
.hero-mark:after{content:'';position:absolute;right:12px;bottom:12px;width:11px;height:11px;background:var(--ink);border-radius:50%}
.kicker{font-size:11px;font-weight:900;letter-spacing:.14em;color:#6d685f;margin-bottom:10px}
.title{font-size:clamp(42px,4.8vw,68px);line-height:.96;letter-spacing:-.075em;font-weight:950;margin:0}
.meta{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.6}
.edit-btn{display:inline-flex;align-items:center;gap:10px;padding:15px 20px;border-radius:999px;background:var(--ink);color:#fff;border:1px solid var(--ink);font-size:13px;font-weight:860}
.edit-btn:hover{background:var(--acid);color:var(--ink)}
.sections{display:flex;flex-direction:column;gap:0;margin-top:12px}
.section-card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:38px 0 43px;min-height:0}.section-card:last-child{border-bottom:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:0;border:0}
.section-title{font-size:14px;font-weight:900;letter-spacing:.1em}
.section-sub{font-size:11px;color:var(--muted)}
.topic-wrap{display:flex;flex-wrap:wrap;gap:11px;padding-top:20px}
.topic-pill{display:inline-flex;align-items:center;padding:13px 20px;border:1.5px solid #c8c1b5;border-radius:999px;background:#eeebe4;font-size:15px;font-weight:830;letter-spacing:-.025em}
.topic-empty,.events-empty{padding-top:22px;font-size:18px;line-height:1.5;color:var(--muted)}
.event-list{padding-top:16px}
.event-item{padding:18px 0;border-bottom:1px solid #e4e0d7}
.event-item:first-child{padding-top:10px}
.event-name{font-size:24px;font-weight:880;letter-spacing:-.04em;line-height:1.15}
.event-meta{margin-top:7px;font-size:13px;color:var(--muted)}
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,10,10,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(560px,100vw);background:var(--paper);border-left:1.5px solid var(--ink);transform:translateX(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);z-index:41;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:28px;border-bottom:1px solid #d9d5cc;display:flex;align-items:center;justify-content:space-between;gap:12px}.drawer-title{font-size:30px;font-weight:900;letter-spacing:-.06em}.drawer-close{border:1px solid var(--ink);background:#fff;border-radius:999px;padding:10px 14px;font-weight:800}
.form{padding:28px;overflow:auto;display:grid;gap:30px}
.field label{display:block;font-size:12px;font-weight:900;letter-spacing:.12em;margin-bottom:14px}
.text-input{width:100%;border:0;background:transparent;border-bottom:1.5px solid var(--ink);padding:0 0 16px;font-size:40px;font-weight:700;letter-spacing:-.05em;outline:none;border-radius:0}
.text-input::placeholder{color:#9b9588}
.topic-editor{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic-option{padding:16px 16px 15px;border:1.5px solid #c8c1b5;border-radius:18px;background:#fff;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.topic-option strong{display:block;font-size:16px;line-height:1.25;letter-spacing:-.03em}.topic-option span{font-size:11px;color:var(--muted);line-height:1.5}.topic-option strong{margin-bottom:6px}
.topic-option.active{background:var(--acid);border-color:var(--ink)}
.topic-check{display:grid;place-items:center;width:24px;height:24px;border:1px solid currentColor;border-radius:50%;font-size:17px;flex:0 0 24px}
.form-actions{margin-top:auto;display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 78%,rgba(251,250,246,0));padding-top:8px}
.btn{flex:1;padding:17px 20px;border-radius:999px;border:1px solid var(--ink);font-size:14px;font-weight:860}.btn-primary{background:var(--ink);color:#fff}.btn-primary:hover{background:var(--acid);color:var(--ink)}.btn-secondary{background:transparent}.btn-secondary:hover{background:#ece8df}
.note{font-size:12px;color:var(--muted);line-height:1.6}
@media (max-width:900px){.hero{grid-template-columns:1fr;align-items:start}.edit-btn{justify-self:start}}
@media (max-width:760px){.page{width:calc(100% - 16px);margin:8px auto 22px;border-radius:22px}.nav{height:66px;padding:0 16px}.brand{font-size:12px}.mark{width:30px;height:30px}.back-link{padding:10px 14px;font-size:12px}.main{padding:28px 20px 42px}.hero{gap:18px;padding-bottom:26px}.hero-mark{width:70px;height:70px;border-radius:22px;font-size:21px}.title{font-size:46px}.sections{margin-top:20px;gap:16px}.section-card{padding:27px 0;border-radius:0}.topic-pill{font-size:14px;padding:11px 15px}.event-name{font-size:21px}.drawer-head,.form{padding:18px}.drawer-title{font-size:24px}.text-input{font-size:32px}.topic-editor{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>.main[hidden],.dm-profile-gate[hidden]{display:none!important}.dm-profile-gate{padding:80px 56px 100px;min-height:60vh}.dm-profile-gate h2{font-size:clamp(35px,5vw,60px);letter-spacing:-.06em;margin:0 0 12px}.dm-profile-gate p{margin-bottom:22px;color:#625f58}.dm-profile-gate .back-link{margin:0 10px 10px 0}</style></head>
<body>
<div class="page">
  <nav class="nav">
    <a class="brand" href="./#about"><span class="mark">D</span>DESIGN MATTERS</a>
    <a class="back-link" href="./#dm-community">← Back to Design Matters</a>
  </nav>
  <div class="dm-profile-gate" id="profileGate"><h2>YOUR SPACE / 个人空间</h2><p>正在载入你的 Profile…</p><a class="back-link" href="./?member=login">邮箱登录 →</a> <a class="back-link" href="./#dm-community">选择话题 →</a></div><main class="main" id="profileMain" hidden>
    <section class="hero">
      <div class="hero-mark">DM</div>
      <div>
        <div class="kicker">YOUR SPACE / 个人空间</div>
        <h1 class="title" id="profileName">我的 Design Matters</h1>
        <div class="meta" id="profileMeta">你关注的话题和过往参与会显示在这里。</div>
      </div>
      <button class="edit-btn" id="editProfileBtn" type="button">Edit Profile ↗</button>
    </section>

    <section class="sections">
      <article class="section-card">
        <div class="section-head">
          <div>
            <div class="section-title">关注的话题</div>
            
          </div>
        </div>
        <div class="topic-wrap" id="topicsWrap"></div>
        <div class="topic-empty" id="topicsEmpty" hidden>还没有选择话题。</div>
      </article>

      <article class="section-card">
        <div class="section-head">
          <div>
            <div class="section-title">过往活动</div>
            
          </div>
        </div>
        <div class="event-list" id="eventsWrap"></div>
        <div class="events-empty" id="eventsEmpty" hidden>期待你的第一次参与。</div>
      </article>
    </section>
  </main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="editor" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">Edit Profile</div>
    <button class="drawer-close" id="closeEditor" type="button">Close</button>
  </div>
  <form class="form" id="editForm">
    <div class="field">
      <label for="nameInput">名字</label>
      <input class="text-input" id="nameInput" type="text" maxlength="60" placeholder="我的 Design Matters">
    </div>
    <div class="field">
      <label>关注的话题</label>
      <div class="topic-editor" id="topicEditor"></div>
      <p class="note">可以修改你想持续关注的主题。</p>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" id="cancelEdit" type="button">Cancel</button>
      <button class="btn btn-primary" type="submit">Save</button>
    </div>
  </form>
</aside>

<script type="module">
import {currentMember,supabase,logoutMember} from './dm-member-client.js?v=20261015-browser-session-v1';
const DEFAULT_NAME='我的 Design Matters';
const TOPICS=[
['agentic-products-agent-ux','Agent 体验与人机控制','Agent Experience & Human Control'],
['enterprise-ai','企业 AI 与流程重构','Enterprise AI & Workflow Redesign'],
['vibe-coding-design-roles','AI 共创、Vibe Coding 与原型构建','AI-assisted Building & Prototyping'],
['design-judgment-future-work','设计判断、影响力与决策权','Design Judgment & Agency'],
['ai-native-startups-product-strategy','AI-native 产品与组织重构','AI-native Products & Teams']
];
const $=id=>document.getElementById(id);
const valid=new Set(TOPICS.map(item=>item[0]));
let member=null,draftTopics=[],events=[];
function renderTopics(){
 const wrap=$('topicsWrap');wrap.replaceChildren();
 const ids=(member?.topics||[]).filter(id=>valid.has(id));
 $('topicsEmpty').hidden=ids.length>0;
 for(const id of ids){const topic=TOPICS.find(t=>t[0]===id);
  const pill=document.createElement('span');pill.className='topic-pill';pill.textContent=topic[1];wrap.appendChild(pill)}
}
function renderEvents(){
 const wrap=$('eventsWrap');wrap.replaceChildren();
 $('eventsEmpty').hidden=events.length>0;
 for(const ev of events){const item=document.createElement('div');item.className='event-item';
  const name=document.createElement('div');name.className='event-name';name.textContent=ev.title||ev.event_id||'Roundtable';
  const meta=document.createElement('div');meta.className='event-meta';meta.textContent=[ev.status,ev.date].filter(Boolean).join(' · ');
  item.append(name,meta);wrap.appendChild(item)}
}
function renderHeader(){
 $('profileName').textContent=member?.display_name||DEFAULT_NAME;
 $('profileMeta').textContent=member?.email||'你关注的话题和过往参与会显示在这里。';
}
function renderEditorOptions(){
 const editor=$('topicEditor');editor.replaceChildren();
 TOPICS.forEach(([id,title,desc])=>{
  const btn=document.createElement('button');btn.type='button';const picked=draftTopics.includes(id);
  btn.className='topic-option'+(picked?' active':'');btn.setAttribute('aria-pressed',String(picked));btn.dataset.id=id;
  const content=document.createElement('div');const strong=document.createElement('strong');strong.textContent=title;
  const small=document.createElement('span');small.textContent=desc;content.append(strong,small);
  const check=document.createElement('span');check.className='topic-check';check.textContent=picked?'✓':'+';
  btn.append(content,check);
  btn.addEventListener('click',()=>{draftTopics=draftTopics.includes(id)?draftTopics.filter(x=>x!==id):[...draftTopics,id];renderEditorOptions()});
  editor.appendChild(btn);
 });
}
function render(){renderHeader();renderTopics();renderEvents()}
const drawer=$('editor'),backdrop=$('drawerBackdrop');
function openDrawer(){
 if(!member)return;draftTopics=[...(member.topics||[])];$('nameInput').value=member.display_name===DEFAULT_NAME?'':member.display_name;
 renderEditorOptions();drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
}
function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true');document.body.style.overflow=''}
$('editProfileBtn').addEventListener('click',openDrawer);
$('closeEditor').addEventListener('click',closeDrawer);
$('cancelEdit').addEventListener('click',closeDrawer);
backdrop.addEventListener('click',closeDrawer);
$('editForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!member)return;
 const save=$('editForm').querySelector('[type="submit"]');if(save)save.disabled=true;
 try{
  const next=($('nameInput').value||'').trim().slice(0,80)||DEFAULT_NAME;
  const {data,error}=await supabase.from('dm_member_intake').update({display_name:next,topics:draftTopics,updated_at:new Date().toISOString()})
      .eq('user_id',member.user_id).select().single();
  if(error)throw error;
  member=data;render();closeDrawer();
 }catch(error){alert('保存失败：'+(error.message||'请稍后重试'));}
 finally{if(save)save.disabled=false}
});
async function init(){
 const gate=$('profileGate');
 try{
  const {session,member:result}=await currentMember();
  if(!session||!result){gate.hidden=false;gate.querySelector('p').textContent=session?'当前浏览器还没有创建 Profile，请先从首页选择话题注册。':'请从首页创建 Profile；如果曾经注册，请使用原来的浏览器访问。';return}
  member=result;
  const {data, error}=await supabase.from('dm_member_event_records').select('event_id,status').eq('user_id',member.user_id);
  if(!error&&data?.length){
   let records=data.map(x=>({event_id:x.event_id,status:x.status}));
   const catalog=await supabase.from('dm_community_event_catalog').select('event_id,title,start_at').in('event_id',records.map(x=>x.event_id));
   if(!catalog.error){records=records.map(x=>{const info=catalog.data.find(v=>v.event_id===x.event_id);return {...x,title:info?.title||x.event_id,date:info?.start_at?.slice(0,10)||''}})}
   events=records;
  }
  $('profileMain').hidden=false;gate.hidden=true;render();
 }catch(error){gate.hidden=false;gate.querySelector('p').textContent='暂时无法载入 Profile：'+(error.message||'请重试');}
}
init();
</script>
</body>
</html>
